<v-container fluid data-aid="grid_screen">
	<v-dialog v-model="showOptionsDialog" max-width="540">
		<v-card class="options-dialog">
			<v-card-title>{{i18n.options}}</v-card-title>
			<v-card-text data-aid="grid_options">
				<span data-aid="grid_options_timezone_select">
					<v-select id="gridTimezone" @update:model-value="zone = $event; saveTimezone()" v-model="zone" :items="$root.timezones" :hint="i18n.timezoneHelp" persistent-hint prepend-icon="fa-user-clock" data-aid="grid_options_timezone_select" :aria-label="i18n.ariaGridTimezone"></v-select>
				</span>
				<span data-aid="grid_options_more_columns_toggle">
					<v-checkbox id="moreColumns" v-model="moreColumns" :hint="i18n.moreColumnsHelp" persistent-hint :label="i18n.moreColumns" data-aid="grid_more_columns_toggle"></v-checkbox>
				</span>
			</v-card-text>
			<v-card-actions>
				<v-spacer></v-spacer>
				<v-btn variant="text" @click="showOptionsDialog = false">{{ i18n.close }}</v-btn>
			</v-card-actions>
		</v-card>
	</v-dialog>
	<v-row>
		<v-col>
			<v-row>
				<v-toolbar class="so-toolbar elevation-0">
					<h4 v-if="metricsEnabled" class="ml-2 my-0" data-aid="grid_summary">{{ i18n.gridEps }} {{ formatCount(gridEps) }}</h4>
					<v-spacer></v-spacer>
					<v-text-field v-model="gridFilter" clearable prepend-inner-icon="fa-filter" :label="i18n.filterResults" hide-details class="toolbar-field no-print mx-2" style="max-width: 250px;" data-aid="grid_filter"></v-text-field>
					<v-btn icon variant="flat" @click.stop="loadData()" id="grid-refresh-button" class="circle-button mx-2" data-aid="grid_refresh_button" :aria-label="i18n.ariaGridRefresh">
						<v-icon>fa-sync</v-icon>
					</v-btn>
					<v-btn icon variant="flat" class="circle-button mx-2" :title="i18n.options" @click="showOptionsDialog = true" id="gridOptionsHeader" data-aid="grid_options_button" :aria-label="i18n.options">
						<v-icon>fa-gear</v-icon>
					</v-btn>
					<v-btn icon variant="flat" class="circle-button mx-2" :target="$root.target('so-help')" :href="$root.parameters.docsUrl + 'grid'" :title="i18n.contextualDocsBtn" data-aid="grid_docs" :aria-label="i18n.contextualDocsBtn">
						<v-icon>fa-circle-question</v-icon>
					</v-btn>
				</v-toolbar>
			</v-row>
			<v-row>
				<v-data-table :search="gridFilter" :sort-by="sortBy" @update:sort-by="val => sortBy = val" @update:items-per-page="val => itemsPerPage = val"
					data-aid="grid_list" :items-per-page-options="itemsPerPageOptions" :expanded="expanded" @update:expanded="val => expanded = val"
					v-model:items-per-page="itemsPerPage" must-sort :headers="headers" :items="nodes">
					<template #headers="{ columns, isSorted, getSortIcon, toggleSort }">
						<tr>
							<template v-for="header in columns" :key="header.key">
								<th :class="[ header.align, {'is-sorted': isSorted(header)} ]" v-if="showHeader(header)" :data-aid="'grid_header_' + header?.value?.toLowerCase()" scope="col" :aria-sort="isSorted(header) ? (getSortIcon(header) === '$sortAsc' ? 'ascending' : 'descending') : 'none'">
									<span @click="toggleSort(header)">
										{{ header.title }}
									</span>
									<template v-if="isSorted(header)">
										<v-icon>
											{{ getSortIcon(header) === '$sortAsc' ? 'fa-caret-up' : 'fa-caret-down'}}
										</v-icon>
									</template>
								</th>
							</template>
						</tr>
					</template>
					<template #item="{ item, isExpanded, toggleExpand, internalItem }">
						<tr color="error" :class="{'stale': !areMetricsCurrent(item), 'seamless-expanded-row': isExpanded(internalItem), 'main-row': true}">
							<td>
								<v-btn :id="'expandNode_' + item.id" icon variant="text" size="small" @click="toggleExpand(internalItem)" :aria-expanded="isExpanded(internalItem)" :aria-label="i18n.ariaExpandNode">
									<v-icon v-if="isExpanded(internalItem)" :alt="i18n.expand" :title="i18n.nodeExpandHelp" data-aid="grid_node_collapse">fa-angle-down</v-icon>
									<v-icon v-else :alt="i18n.expand" :title="i18n.nodeExpandHelp" data-aid="grid_node_expand">fa-angle-right</v-icon>
								</v-btn>
							</td>
							<td>
								<v-icon v-if="item.status != NodeStatusOk" :id="'nodeFaultIcon_' + item.id" :color="colorNodeStatus(item.status, item.nonCriticalNode)" data-aid="grid_node_icon_status_display">{{ iconNodeStatus(item.status) }}</v-icon>
							</td>
							<td v-if="$root.hasSubgrids()" :id="'nodeGridId_' + item.id" v-text="item.gridId ? item.gridId : i18n.gridLocal"></td>
							<td :id="'nodeId_' + item.id" v-text="item.id"></td>
							<td :id="'nodeRole_' + item.id" v-text="$root.localizeMessage(item.role)" class="d-none d-md-table-cell"></td>
							<td :id="'nodeAddress_' + item.id" v-text="item.address" class="d-none d-lg-table-cell"></td>
							<td :id="'nodeVersion_' + item.id" v-text="item.version" class="d-none d-lg-table-cell"></td>
							<td :id="'nodeModel_' + item.id" v-text="item.model" class="d-none d-lg-table-cell"></td>
							<td v-if="metricsEnabled" class="d-none d-lg-table-cell">
								<span :id="'nodeEps_' + item.id">{{ formatCount(item.consumptionEps) }}</span>
							</td>
							<td v-if="metricsEnabled" class="d-none d-xl-table-cell">
								<span :id="'nodeMemUsed_' + item.id">{{ formatDecimal1(item.memoryUsedPct) }}%</span>
							</td>
							<td v-if="metricsEnabled" class="d-none d-xl-table-cell">
								<span :id="'nodeDiskUsedRoot_' + item.id">{{ formatDecimal1(item.diskUsedRootPct) }}%</span>
							</td>
							<td v-if="metricsEnabled" class="d-none d-xl-table-cell">
								<span :id="'nodeDiskUsedNsm_' + item.id">{{ formatDecimal1(item.diskUsedNsmPct) }}%</span>
							</td>
							<td v-if="metricsEnabled" class="d-none d-xl-table-cell">
								<span :id="'nodeCpuUsed_' + item.id">{{ formatDecimal1(item.cpuUsedPct) }}%</span>
							</td>
							<td v-if="metricsEnabled" class="d-none d-xl-table-cell">
								<span :id="'nodeTrafficManIn_' + item.id">{{ formatDecimal1(item.trafficManInMbs) }} {{ i18n.mbps }}</span>
							</td>
							<td v-if="metricsEnabled" class="d-none d-xl-table-cell">
								<span :id="'nodeTrafficManOut_' + item.id">{{ formatDecimal1(item.trafficManOutMbs) }} {{ i18n.mbps }}</span>
							</td>
							<td v-if="metricsEnabled && moreColumns" class="d-none d-xl-table-cell">
								<span :id="'nodeTrafficMonIn_' + item.id">{{ formatDecimal1(item.trafficMonInMbs) }} {{ i18n.mbps }}</span>
							</td>
							<td v-if="metricsEnabled && moreColumns" class="d-none d-xl-table-cell">
								<span :id="'nodeTrafficMonInDrops_' + item.id">{{ formatDecimal1(item.trafficMonDropsMbs) }} {{ i18n.mbps }}</span>
							</td>
							<td v-if="metricsEnabled && moreColumns" class="d-none d-xl-table-cell">
								<span :id="'nodeCaptureLoss_' + item.id">{{ formatDecimal1(item.captureLossPct) }}%</span>
							</td>
							<td v-if="metricsEnabled && moreColumns" class="d-none d-xl-table-cell">
								<span :id="'nodeZeekLoss_' + item.id">{{ formatDecimal1(item.zeekLossPct) }}%</span>
							</td>
							<td v-if="metricsEnabled && moreColumns" class="d-none d-xl-table-cell">
								<span :id="'nodeSuriLoss_' + item.id">{{ formatDecimal1(item.suriLossPct) }}%</span>
							</td>
							<td v-if="metricsEnabled && moreColumns" class="d-none d-xl-table-cell">
								<span :id="'nodePcapDays_' + item.id">{{ formatDecimal1(item.pcapDays) }} {{ i18n.days }}</span>
							</td>
							<td :id="'nodeUptimeSeconds_' + item.id" class="d-none d-lg-table-cell">{{ formatDuration(item.uptimeSeconds) }}</td>
							<td><v-chip variant='flat' :id="'nodeStatus_' + item.id" class="nodeStatus" @click="expand(item)" density="compact" :color="colorNodeStatus(item.status, item.nonCriticalNode)" data-aid="grid_node_status_display">{{ $root.localizeMessage(item.status) }}</v-chip></td>
						</tr>
					</template>
					<template #expanded-row="{ item, index }">
						<tr data-aid="grid_node_details" class="expanded-row">
							<td :colspan="headers.length" class="px-0">
								<v-container fluid grid-list-sm class="pa-4">
									<v-row>
										<v-col cols="12" lg="4" data-aid="grid_node_metrics">
											<v-card>
												<v-card-title v-text="i18n.nodeStatus" role="heading" aria-level="3"></v-card-title>
												<v-card-text>
													<dl class="ws-normal">
														<template v-if="$root.hasSubgrids">
															<dt class="filter label">{{ i18n.gridId }}:</dt>
															<dd id="node_grid_id" class="filter value">{{ item.gridId ? item.gridId : i18n.gridLocal }}</dd>
														</template>
														
														<dt class="filter label">{{ i18n.id }}:</dt>
														<dd id="node_id" class="filter value">{{ item.id }}</dd>
													
														<dt class="filter label">{{ i18n.role }}:</dt>
														<dd id="node_role" class="filter value">{{ $root.localizeMessage(item.role) }}</dd>
													
														<dt class="filter label">{{ i18n.address }}:</dt>
														<dd id="node_address" class="filter value">{{ item.address }}</dd>
													
														<dt class="filter label">{{ i18n.version }}:</dt>
														<dd id="node_version" class="filter value">{{ item.version }}</dd>
													
														<dt class="filter label">{{ i18n.model }}:</dt>
														<dd id="node_model" class="filter value">{{ item.model }}</dd>

														<dt class="filter label">{{ i18n.dateOnline }}:</dt>
														<dd id="node_createTime" class="filter value">{{ toTZ(item.onlineTime) }}</dd>
													
														<dt class="filter label">{{ i18n.dateDataEpoch }}:</dt>
														<dd id="node_dataEpoch" class="filter value">{{ toTZ(item.epochTime) }}</dd>

														<dt class="filter label">{{ i18n.dateUpdated }}:</dt>
														<dd id="node_updateTime" class="filter value">{{ toTZ(item.updateTime) }} <span v-if="!areMetricsCurrent(item)" class="stale">{{ i18n.stale }}</span></dd>

														<dt class="filter label">{{ i18n.uptime }}:</dt>
														<dd id="node_age" :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">{{ formatDuration(item.uptimeSeconds) }}</dd>

														<dt class="filter label">{{ i18n.osUptime }}:</dt>
														<dd id="node_uptime" :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
															{{ formatDuration(item.osUptimeSeconds) }}
															<span v-if="item.osNeedsRestart" id="node_restart-required-note" :class="areMetricsCurrent(item) ? 'info-text' : 'info-text stale'">
																{{ i18n.restartRequired }}
															</span>
														</dd>
														
														<template v-if="item.metricsEnabled">
															<dt class="filter label">{{ i18n.lastHighstate }}:</dt>
															<dd id="node_last_highstate" :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<span v-if="item.highstateAgeSeconds > UNREALISTIC_AGE">
																	{{ i18n.never }}
																</span>
																<span v-else>
																	{{ formatDuration(item.highstateAgeSeconds) }} {{i18n.ago}}
																</span>
															</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt class="filter label">{{ i18n.nodeStatusProcess }}</dt>
															<dd id="node_processStatus" :class="areMetricsCurrent(item) ? 'filter value text-' + colorNodeStatus(item.processStatus) : 'filter value stale'">
																{{ $root.localizeMessage(item.processStatus) }}
																<span v-if="item.nonCriticalNode" id="node_processStatusNonCritical">({{i18n.nonCriticalNode}})</span>
															</dd>
														</template>
														
														<dt class="filter label">{{ i18n.nodeStatusConnection }}</dt>
														<dd id="node_connectionStatus" :class="areMetricsCurrent(item) ? 'filter value text-' + colorNodeStatus(item.connectionStatus, item.nonCriticalNode) : 'filter value stale'">
															{{ $root.localizeMessage(item.connectionStatus) }}
															<span v-if="item.nonCriticalNode" id="node_connectionStatusNonCritical">({{i18n.nonCriticalNode}})</span>
														</dd>

														<template v-if="item.metricsEnabled && hasEventstoreHealth(item)">
															<dt class="filter label">{{ i18n.eventstoreStatus }}:</dt>
															<dd id="node_eventstoreStatus" :class="areMetricsCurrent(item) ? 'filter value text-' + colorNodeStatus(item.eventstoreStatus) : 'filter value stale'">
																{{ $root.localizeMessage(item.eventstoreStatus) }}
															</dd>
														</template>
														
														<template v-if="item.metricsEnabled">
															<dt class="filter label">{{ i18n.nodeStatusRaid }}</dt>
															<dd class="filter value">
																<span v-if="!item.raidStatus || item.raidStatus == NodeStatusUnknown" id="node_raidStatus">
																	{{ i18n.featureRequiresAppliance }}
																</span>
																<span v-else id="node_raidStatus" v-text="$root.localizeMessage(item.raidStatus)" :class="areMetricsCurrent(item) ? 'filter value text-' + colorNodeStatus(item.raidStatus) : 'filter value stale'"></span>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && hasEventstore(item)">
															<dt class="filter label">{{ i18n.epsConsumption }}</dt>
															<dd id="node_consumptionEps" :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">{{ formatCount(item.consumptionEps) }}</dd>
														</template>
														
														<template v-if="item.metricsEnabled">
															<dt :id="`node-memusage-${index}-label`" class="filter label">{{ i18n.memUsage }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_memory" v-model="item.memoryUsedPct" height="15" :color="formatLinearColor(item.memoryUsedPct, 70, 80, 90)" :aria-labelledby="`node-memusage-${index}-label`">
																	<template #default="{ value }">
																		<strong>{{ formatDecimal1(item.memoryUsedPct) }}% {{ i18n.of }} {{ formatDecimal1(item.memoryTotalGB) }} {{ i18n.gigabytes }}</strong>
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt :id="`node-swapusage-${index}-label`" class="filter label">{{ i18n.swapUsage }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_swap" v-model="item.swapUsedPct" height="15" :color="formatLinearColor(item.swapUsedPct, 70, 80, 90)" :aria-labelledby="`node-swapusage-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.swapUsedPct) }}% {{ i18n.of }} {{ formatDecimal1(item.swapTotalGB) }} {{ i18n.gigabytes }}
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt :id="`node-cpuusage-${index}-label`" class="filter label">{{ i18n.cpuUsage }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_cpu" v-model="item.cpuUsedPct" height="15" :color="formatLinearColor(item.cpuUsedPct, 85, 90, 95)" :aria-labelledby="`node-cpuusage-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.cpuUsedPct) }}%
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt :id="`node-iowait-${index}-label`" class="filter label">{{ i18n.ioWait }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_ioWait" v-model="item.ioWaitPct" height="15" :color="formatLinearColor(item.ioWaitPct, 2.5, 5, 10)" :aria-labelledby="`node-iowait-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.ioWaitPct) }}%
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && canTest(item)">
															<dt :id="`node-captureloss-${index}-label`" class="filter label">{{ i18n.captureLoss }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_captureLoss" v-model="item.captureLossPct" height="15" :color="formatLinearColor(item.captureLossPct, 0.01, 0.5, 1.5)" :aria-labelledby="`node-captureloss-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.captureLossPct) }}%
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && hasZeek(item)">
															<dt :id="`node-zeekloss-${index}-label`" class="filter label">{{ i18n.zeekLoss }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_zeekLoss" v-model="item.zeekLossPct" height="15" :color="formatLinearColor(item.zeekLossPct, 0.01, 0.5, 1.5)" :aria-labelledby="`node-zeekloss-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.zeekLossPct) }}%
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && hasSuri(item)">
															<dt :id="`node-suricataloss-${index}-label`" class="filter label">{{ i18n.suricataLoss }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_suricataLoss" v-model="item.suriLossPct" height="15" :color="formatLinearColor(item.suriLossPct, 0.01, 0.5, 1.5)" :aria-labelledby="`node-suricataloss-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.suriLossPct) }}%
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && hasSuri(item)">
															<dt class="filter label">{{ i18n.suriRulesLoaded }}:</dt>
															<dd id="node_suriRulesLoaded" :class="areMetricsCurrent(item) ? 'filter value text-' + colorSuriRules(item) : 'filter value stale'">
																<!-- Unknown status (container down, socket error) -->
																<span v-if="item.suriRulesStatus === 'unknown'">
																	{{ i18n.rulesUnknown }}
																</span>
																<!-- All rules failed to load -->
																<span v-else-if="item.suriRulesLoaded === 0 && item.suriRulesFailed > 0">
																	{{ item.suriRulesFailed }} {{ i18n.rulesAllFailed }}
																</span>
																<!-- Some rules loaded, some failed -->
																<span v-else-if="item.suriRulesLoaded > 0 && item.suriRulesFailed > 0">
																	{{ item.suriRulesLoaded }} {{ i18n.rulesLoaded }}, {{ item.suriRulesFailed }} {{ i18n.rulesFailed }}
																</span>
																<!-- No rules configured (none loaded, none failed) -->
																<span v-else-if="item.suriRulesLoaded === 0 && item.suriRulesFailed === 0">
																	{{ i18n.rulesNoRulesConfigured }}
																</span>
																<!-- All rules loaded successfully -->
																<span v-else>
																	{{ item.suriRulesLoaded }} {{ i18n.rulesLoaded }}
																</span>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && hasSuri(item) && item.suriRulesReloadTime">
															<dt class="filter label">{{ i18n.suriRulesReloadTime }}:</dt>
															<dd id="node_suriRulesReloadTime" :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																{{ toTZ(item.suriRulesReloadTime) }}
															</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt :id="`node-diskroot-${index}-label`" class="filter label">{{ i18n.diskUsageRoot }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_diskRoot" v-model="item.diskUsedRootPct" height="15" :color="formatLinearColor(item.diskUsedRootPct, 85, 90, 95)" :aria-labelledby="`node-diskroot-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.diskUsedRootPct) }}% {{ i18n.of }} {{ formatDecimal1(item.diskTotalRootGB) }} {{ i18n.gigabytes }}
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt :id="`node-disknsm-${index}-label`" class="filter label">{{ i18n.diskUsageNsm }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'">
																<v-progress-linear id="node_diskNsm" v-model="item.diskUsedNsmPct" height="15" :color="formatLinearColor(item.diskUsedNsmPct, 85, 90, 95)" :aria-labelledby="`node-disknsm-${index}-label`">
																	<template #default="{ value }">
																		{{ formatDecimal1(item.diskUsedNsmPct) }}% {{ i18n.of }} {{ formatDecimal1(item.diskTotalNsmGB) }} {{ i18n.gigabytes }}
																	</template>
																</v-progress-linear>
															</dd>
														</template>

														<template v-if="item.metricsEnabled && hasEventstore(item)">
															<dt class="filter label">{{ i18n.diskUsageElastic }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_diskElastic">{{ formatDecimal1(item.diskUsedElasticGB) }} {{ i18n.gigabytes }}</dd>
														</template>

														<template v-if="item.metricsEnabled && hasMetricstore(item)">
															<dt class="filter label">{{ i18n.diskUsageInfluxDb }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_diskInflux">{{ formatDecimal1(item.diskUsedInfluxDbGB) }} {{ i18n.gigabytes }}</dd>
														</template>

														<template v-if="item.metricsEnabled && canTest(item)">
															<dt class="filter label">{{ i18n.pcapRetention }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_pcapRetention">{{ formatDecimal1(item.pcapDays) }} {{ i18n.days }}</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt class="filter label">{{ i18n.loadAverage }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_load">{{ formatDecimal1(item.load1m) }}, {{ formatDecimal1(item.load5m) }}, {{ formatDecimal1(item.load15m) }}</dd>
														</template>

														<template v-if="item.metricsEnabled && hasQueuestore(item)">
															<dt class="filter label">{{ i18n.redisQueueSize }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_redisQueue">{{ formatCount(item.redisQueueSize) }}</dd>
														</template>

														<template v-if="item.metricsEnabled && canTest(item)">
															<dt class="filter label">{{ i18n.trafficMonIn }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_trafficMonIn">{{ formatDecimal1(item.trafficMonInMbs) }} {{ i18n.mbps }}</dd>
														</template>

														<template v-if="item.metricsEnabled && canTest(item)">
															<dt class="filter label">{{ i18n.trafficMonInDrops }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_trafficMonInDrops">{{ formatDecimal1(item.trafficMonInDropsMbs) }} {{ i18n.mbps }}</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt class="filter label">{{ i18n.trafficManIn }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_trafficManIn">{{ formatDecimal1(item.trafficManInMbs) }} {{ i18n.mbps }}</dd>
														</template>

														<template v-if="item.metricsEnabled">
															<dt class="filter label">{{ i18n.trafficManOut }}:</dt>
															<dd :class="areMetricsCurrent(item) ? 'filter value' : 'filter value stale'" id="node_trafficManOut">{{ formatDecimal1(item.trafficManOutMbs) }} {{ i18n.mbps }}</dd>
														</template>

														<dt class="filter label">{{ i18n.keywords }}:</dt>
														<dd class="filter value text-wrap" id="node_keywords">{{ item.keywords }}</dd>

														<dt class="filter label">{{ i18n.description }}:</dt>
														<dd class="filter value text-wrap" id="node_desc">{{ item.description }}</dd>
													</dl>
													
													<div class="text-justify">
														<v-btn id="dashboard-link" icon variant="text" size="small" :title="i18n.nodeDashboard" :href="item.dashboardLink" :target="$root.target('influxdb')" :disabled="$root.isNodeInSubgrid(item)" class="theme-text" data-aid="grid_node_nav_influx" :aria-label="i18n.nodeDashboard">
															<v-icon class="theme-icon">fa-chart-line</v-icon>
														</v-btn>
														<v-btn v-if="canTest(item)" id="test-minion" icon variant="text" size="small" :title="i18n.nodeTest" @click="showTestConfirm(item)" class="theme-text" data-aid="grid_node_test" :aria-label="i18n.nodeTest">
															<v-icon class="theme-icon">fa-file-import</v-icon>
														</v-btn>
														<v-btn v-if="canUpload(item)" id="import-minion" icon variant="text" size="small" :title="i18n.uploadPCAPEVTX" @click="showUploadConfirm(item)" class="theme-text" data-aid="grid_node_import" :aria-label="i18n.uploadPCAPEVTX">
															<v-icon class="theme-icon">fa-upload</v-icon>
														</v-btn>
														<v-btn v-if="canRestart(item)" id="restart-minion" icon variant="text" size="small" :title="item.osNeedsRestart == 1 ? i18n.restartRequiredHelp : i18n.restartMinionHelp" @click="showRestartConfirm(item)" class="theme-text" data-aid="grid_node_restart" :aria-label="i18n.restartMinionHelp">
															<v-icon :color="item.osNeedsRestart == 1 ? 'info' : ''" :class="{ 'theme-icon': item.osNeedsRestart != 1 }">fa-power-off</v-icon>
														</v-btn>
														<v-btn icon variant="text" size="small" :title="i18n.clickForMoreInformation" :href="$root.parameters.docsUrl + 'grid'" :target="$root.target('so-help')" class="theme-text" data-aid="grid_node_help" :aria-label="i18n.ariaHelpLink">
															<v-icon class="theme-icon">fa-circle-question</v-icon>
														</v-btn>
													</div>
												</v-card-text>
											</v-card>
										</v-col>
										<v-col cols="12" lg="4" data-aid="grid_node_containers">
											<v-card>
												<v-card-title v-text="i18n.containerStatus" role="heading" aria-level="3"></v-card-title>
												<v-card-text>
													<v-table v-if="item.statusCode <= 1" class="no-background">
														<template #default>
															<thead>
																<tr>
																	<th class="text-right" v-text="i18n.container" scope="col"></th>
																	<th class="text-center" v-text="i18n.hunt" scope="col"></th>
																	<th class="text-left" v-text="i18n.status" scope="col"></th>
																	<th class="text-left d-none d-lg-table-cell" v-text="i18n.details" scope="col"></th>
																</tr>
															</thead>
															<tbody>
																<tr v-for="container in item.containers" :key="container.Name">
																	<td class="text-right">
																		{{ container.Name }}
																	</td>
																	<td class="text-center">
																		<router-link :to="generateContainerLink(item, container)" :class="'theme-text text-decoration-none hunt-logs-' + container.Name" :data-aid="'grid_node_hunt_' + container.Name" :aria-label="i18n.huntForError + ' — ' + container.Name">
																			<v-icon :title="i18n.huntForError" class="theme-icon" >fa-crosshairs</v-icon>
																		</router-link>
																	</td>
																	<td :class="areMetricsCurrent(item) ? 'text-left text-' + colorContainerStatus(container.Status) : 'stale text-left'">
																		{{ $root.localizeMessage(container.Status) }}
																	</td>
																	<td :class="areMetricsCurrent(item) ? 'text-left d-none d-lg-table-cell text-' + colorContainerDetails(container.Details) : 'stale info-text-left text-left d-none d-lg-table-cell'">
																		{{ container.Details }}
																	</td>
																</tr>
															</tbody>
														</template>
													</v-table>
													<div v-else>
														{{ i18n["nodeStatusCode_" + item.statusCode] }}
													</div>
												</v-card-text>
											</v-card>
										</v-col>
										<v-col cols="12" lg="4" data-aid="grid_node_other">
											<v-card>
												<v-card-title v-text="i18n.nodeImages" role="heading" aria-level="3"></v-card-title>
												<v-card-text>
													<span v-if="!item.imageFront">
														{{ i18n.nodeImageUnavailable }}
														<a :target="$root.target('so-help')" :href="$root.parameters.docsUrl + 'grid'" style="text-decoration: none; cursor: 'pointer'"  :title="i18n.clickForMoreInformation" data-aid="grid_node_other_help" :aria-label="i18n.ariaHelpLink">
															<v-icon class="mb-2">fa-circle-question</v-icon>
														</a>
													</span>
													<div><img class="appliance-image elevation-5" v-if="item.imageFront" :src="'images/appliances/' + item.imageFront" :alt="i18n.ariaNodeImageFront"></div>
													<div class="mt-2"><img class="appliance-image elevation-5" v-if="item.imageBack" :src="'images/appliances/' + item.imageBack" :alt="i18n.ariaNodeImageBack"></div>
												</v-card-text>
											</v-card>
										</v-col>
									</v-row>
								</v-container>
							</td>
						</tr>
					</template>
				</v-data-table>
			</v-row>
		</v-col>
	</v-row>
	<v-dialog v-model="gridMemberTestConfirmDialog" persistent max-width="480" data-aid="grid_test_dialog">
		<v-card>
			<v-card-title class="text-headline-small" v-text="i18n.gridMemberTestConfirmTitle"></v-card-title>
			<v-card-text v-text="i18n.gridMemberTestConfirmHelp"></v-card-text>
			<v-card-actions>
				<v-spacer></v-spacer>
				<v-btn text id="grid-test-proceed-button" @click="gridMemberTest" v-text="i18n.yes" data-aid="grid_test_confirm"></v-btn>
				<v-btn text id="grid-test-cancel-button" @click="hideTestConfirm" v-text="i18n.no" data-aid="grid_test_cancel"></v-btn>
			</v-card-actions>
		</v-card>
	</v-dialog>
	<v-dialog v-model="gridMemberRestartConfirmDialog" persistent max-width="480" data-aid="grid_restart_dialog">
		<v-card>
			<v-card-title class="text-headline-small" v-text="i18n.gridMemberRestartConfirmTitle"></v-card-title>
			<v-card-text v-html="i18n.gridMemberRestartConfirmHelp"></v-card-text>
			<v-card-actions>
				<v-spacer></v-spacer>
				<v-btn text id="grid-restart-proceed-button" @click="gridMemberRestart" v-text="i18n.yes" data-aid="grid_restart_confirm"></v-btn>
				<v-btn text id="grid-restart-cancel-button" @click="hideRestartConfirm" v-text="i18n.no" data-aid="grid_restart_cancel"></v-btn>
			</v-card-actions>
		</v-card>
	</v-dialog>
	<v-dialog v-model="gridMemberUploadConfirmDialog" persistent max-width="480" data-aid="grid_import_dialog">
		<v-card>
			<v-card-title class="text-headline-small" v-text="pickUploadDialogTitle()"></v-card-title>
			<v-card-text>
				<v-alert class="mt-2 mb-4" type="info" icon="fa-upload" text dense>
					{{ i18n.maxUploadSize }}: {{ formatCount(maxUploadSizeBytes) }} {{ i18n.bytes }}
				</v-alert>
				<v-form ref="gridUpload" v-model="uploadForm.valid" @submit.prevent>
					<v-file-input id="import-value" v-model="uploadForm.attachment" show-size :accept="pickUploadDialogAccept()"
						:rules="[$root.validators.fileSizeLimit(maxUploadSizeBytes, $root.formatCount), $root.validators.fileNotEmpty, $root.validators.fileRequired]"
						data-aid="grid_import_file" :label="i18n.ariaGridUploadFile"></v-file-input>
				</v-form>
			</v-card-text>
			<v-card-actions>
				<v-spacer></v-spacer>
				<v-btn text id="grid-upload-proceed-button" :disabled="!uploadForm.valid" @click="gridMemberUpload" v-text="i18n.upload" data-aid="grid_import_confirm"></v-btn>
				<v-btn text id="grid-upload-cancel-button" @click="hideUploadConfirm" v-text="i18n.cancel" data-aid="grid_import_cancel"></v-btn>
			</v-card-actions>
		</v-card>
	</v-dialog>
</v-container>
