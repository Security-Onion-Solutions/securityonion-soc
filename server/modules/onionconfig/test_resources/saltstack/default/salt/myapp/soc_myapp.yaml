myapp:
  agent_list:
    description: DB-stored, UI-managed list of objects (agent-studio shape)
    storage: db
    readonlyUi: True
    global: True
    syntax: json
    forcedType: "[]{}"
    uiElements:
    - field: name
      label: Name
      forcedType: string
      required: true
    - field: enabled
      label: Enabled
      forcedType: bool
    - field: isOrchestrator
      label: Orchestrator
      forcedType: bool
    - field: model
      label: Model
      forcedType: string
    - field: allowedSkills
      label: Skills
      forcedType: "[]string"
    - field: canDelegateTo
      label: Delegates To
      forcedType: "[]string"
    - field: description
      label: Description
      forcedType: string
    - field: persona
      label: Persona
      forcedType: string
      multiline: true
  my_def:
    jinjaEscaped: True
  foo__txt:
    description: Test file annotation
    file: True
  ro:
    description: read only setting
    readonly: True
  ui_map_typed:
    description: Map list with typed UI elements
    forcedType: "[]{}"
    uiElements:
    - field: port
      label: Port
      forcedType: int
    - field: enabled
      label: Enabled
      forcedType: bool
    - field: name
      label: Name
  ui_json:
    description: UI elements for JSON packing
    uiElements:
    - field: something
      label: something nice
      forcedType: bool
      multiline: false
      default: true
      required: false
      readonly: true
    - field: another
      label: another thing
      forcedType: "[]string"
      options:
      - blue
      - red
      - green
      default: red
    - field: one more
      label: But wait there's more
      multiline: True
      required: true
      regex: "^abc$"
      regexFailureMessage: must conform
